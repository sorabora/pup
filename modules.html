<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Online Parser</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.43.3/ace.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.43.3/theme-monokai.min.js"></script>
    <script src="custom-mode.js"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background: #1e1e1e;
        color: #d4d4d4;
        font-family: "Nunito", sans-serif;
      }
      #editor {
        width: 100%;
        height: 280px;
        border: 1px solid #444;
      }
      #output-panel {
        background: #252526;
        color: #d4d4d4;
        padding: 8px;
        border: 1px solid #444;
      }
      #output-log {
        margin: 0 0 8px;
        white-space: pre-wrap;
      }
      #commandline {
        width: 100%;
        box-sizing: border-box;
        background: #1e1e1e;
        color: #d4d4d4;
        border: 1px solid #444;
        padding: 4px 8px;
      }
      .example-editor {
        border: 1px solid #444;
        border-radius: 6px;
        overflow: hidden;
        margin-bottom: 1rem;
      }
      .doc-section-card {
        background: #252526;
        border: 1px solid #444;
        color: #d4d4d4;
        margin-bottom: 1.5rem;
      }
      .doc-section-card .card-body {
        padding: 1.25rem 1.5rem;
      }
      .doc-section-card h3 {
        margin-top: 0;
        margin-bottom: 1rem;
        font-size: 1.25rem;
        text-transform: capitalize;
      }
      .doc-section-card p:last-of-type {
        margin-bottom: 0;
      }
      #doc-search {
        background: #252526;
        color: #d4d4d4;
        border: 1px solid #444;
      }
      #doc-search::placeholder {
        color: #888;
      }
      #doc-search:focus {
        background: #252526;
        color: #d4d4d4;
        border-color: #569cd6;
        box-shadow: 0 0 0 0.2rem rgba(86, 156, 214, 0.25);
      }
      #doc-search-empty {
        color: #888;
      }
    </style>
  </head>
  <body>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <div class="container mt-4">
      <h1>
        <a href="index.html">Pup Online Transpiler</a> / Modules Documentation
      </h1>
      <div class="row">
        <div class="col-8">
          <button
            onclick="window.open('documentation.html', '_blank')"
            class="btn btn-secondary"
          >
            Language Documentation
          </button>
          <button
            onclick="window.open('modules.html', '_blank')"
            class="btn btn-secondary"
          >
            Modules Documentation
          </button>
        </div>
      </div>
    </div>
    <div class="container mt-4">
      <h1>This page is a work in progress.</h1>
      <p>For now refer to examples to learn these modules.</p>
    </div>
  </body>
</html>
